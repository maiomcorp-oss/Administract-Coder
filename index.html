<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administract 8.0 - +300 Comandos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #00ffcc22, #00ffcc11);
            border-radius: 20px;
            border: 2px solid #00ffcc;
            margin-bottom: 30px;
        }
        .header h1 { color: #00ffcc; font-size: 3em; text-shadow: 0 0 30px #00ffcc44; }
        .header p { color: #aaa; font-size: 1.2em; }
        .editor-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) { .editor-area { grid-template-columns: 1fr; } }
        textarea {
            width: 100%;
            height: 500px;
            background: #1a1a1a;
            color: #a9ffb4;
            border: 2px solid #00ffcc;
            padding: 15px;
            font-size: 14px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }
        .botoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .btn-executar { background: #00ffcc; color: #000; }
        .btn-executar:hover { transform: scale(1.05); background: #00ddbb; }
        .btn-limpar { background: #e74c3c; color: #fff; }
        .btn-limpar:hover { transform: scale(1.05); background: #c0392b; }
        .btn-exemplo { background: #3498db; color: #fff; }
        .btn-exemplo:hover { transform: scale(1.05); background: #2980b9; }
        .btn-compilar { background: #f39c12; color: #fff; }
        .btn-compilar:hover { transform: scale(1.05); background: #e67e22; }
        .btn-comandos { background: #9b59b6; color: #fff; }
        .btn-comandos:hover { transform: scale(1.05); background: #8e44ad; }
        
        #painel {
            background: #0d0d0d;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 30px;
            min-height: 500px;
            position: relative;
            overflow: hidden;
        }
        
        .comandos-lista {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .comandos-lista h3 { color: #00ffcc; margin-bottom: 15px; }
        .comando-item {
            display: inline-block;
            background: #2d2d2d;
            padding: 3px 10px;
            margin: 3px;
            border-radius: 5px;
            font-size: 11px;
            color: #ffd700;
            border: 1px solid #444;
        }
        .comando-item span { color: #a9ffb4; }
        .categoria {
            color: #ff6b6b;
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
        .sub-categoria {
            color: #ffd700;
            margin-top: 5px;
            display: block;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 ADMINISTRACT 8.0</h1>
            <p>Codifique rapidamente em poucas linhas de Codigo</p>
            <p style="color: #ffd700; font-size: 0.9em;">Agora com 320 comandos totais!</p>
        </div>

        <div class="editor-area">
            <div>
                <div class="botoes">
                    <button class="btn-executar" onclick="executar()">▶ EXECUTAR</button>
                    <button class="btn-limpar" onclick="limpar()">🗑️ LIMPAR</button>
                    <button class="btn-exemplo" onclick="exemploIoruba()">base </button>
                    <button class="btn-compilar" onclick="compilar()">📦 COMPILAR</button>
                    <button class="btn-comandos" onclick="mostrarComandos()">📚 COMANDOS</button>
                </div>
                <textarea id="codigo" placeholder="Digite seu código Administract 8.0 aqui..."></textarea>
            </div>
            <div>
                <h3 style="color: #00ffcc; margin-bottom: 10px;">📺 VISUALIZAÇÃO</h3>
                <div id="painel"></div>
            </div>
        </div>

        <div class="comandos-lista" id="lista-comandos" style="display:none;">
            <h3>📚 ADMINISTRACT 8.0 - TODOS OS +300 COMANDOS</h3>
            <div id="comandos-grid"></div>
        </div>
    </div>

    <script>
        // ============================================
        // ADMINISTRACT 8.0 - INTERPRETADOR +300 COMANDOS
        // ============================================
        
        let elementos = {};
        let variaveis = {};
        let colisoes = {};
        let loopAtivo = null;
        let timers = [];
        let loops = [];
        let animacoes = [];
        let eventos = {};
        let bibliotecas = {};

        // ============================================
        // +300 NOVOS COMANDOS
        // ============================================

        const comandos8 = {
            // Comandos de Texto (30)
            texto: ['titulo', 'subtitulo', 'paragrafo', 'texto-central', 'texto-direita', 'texto-esquerda', 'texto-grande', 'texto-pequeno', 'texto-colorido', 'texto-fundo', 'texto-sombra', 'texto-gradiente', 'texto-borda', 'texto-arredondado', 'texto-destaque', 'texto-piscante', 'texto-negrito', 'texto-italico', 'texto-sublinhado', 'texto-riscado', 'texto-maiusculo', 'texto-minusculo', 'texto-capitalizado', 'texto-espacado', 'texto-sombreado', 'texto-brilhante', 'texto-neumorfico', 'texto-glass', 'texto-metalico', 'texto-neon'],
            
            // Comandos de Cores (30)
            cores: ['cor-fundo', 'cor-texto', 'cor-borda', 'cor-primaria', 'cor-secundaria', 'cor-destaque', 'gradiente', 'gradiente-radial', 'gradiente-conico', 'fundo-imagem', 'fundo-transparente', 'fundo-escuro', 'fundo-claro', 'fundo-azul', 'fundo-verde', 'fundo-vermelho', 'fundo-ouro', 'fundo-roxo', 'fundo-rosa', 'fundo-cinza', 'fundo-preto', 'fundo-branco', 'fundo-verde-escuro', 'fundo-azul-escuro', 'fundo-vermelho-escuro', 'fundo-laranja', 'fundo-amarelo', 'fundo-cyan', 'fundo-magenta', 'fundo-turquesa'],
            
            // Comandos de Input (25)
            inputs: ['input-text', 'input-number', 'input-email', 'input-password', 'input-date', 'input-time', 'input-datetime', 'input-color', 'input-range', 'input-search', 'input-tel', 'input-url', 'input-file', 'input-hidden', 'input-month', 'input-week', 'input-datetime-local', 'input-image', 'input-reset', 'input-submit', 'input-button', 'textarea-input', 'checkbox', 'radio', 'select', 'select-multiple', 'datalist', 'fieldset', 'legend', 'label'],
            
            // Comandos de Links (20)
            links: ['link', 'link-novo', 'link-botao', 'link-imagem', 'link-email', 'link-telefone', 'link-whatsapp', 'link-instagram', 'link-twitter', 'link-youtube', 'link-facebook', 'link-linkedin', 'link-github', 'link-discord', 'link-tiktok', 'link-pinterest', 'link-snapchat', 'link-telegram', 'link-signal', 'link-website'],
            
            // Comandos de Upload (20)
            upload: ['upload-arquivo', 'upload-imagem', 'upload-pdf', 'upload-zip', 'upload-multiplo', 'upload-pasta', 'upload-doc', 'upload-xls', 'upload-ppt', 'upload-txt', 'upload-csv', 'upload-json', 'upload-xml', 'upload-html', 'upload-css', 'upload-js', 'upload-mp3', 'upload-mp4', 'upload-avi', 'upload-todos'],
            
            // Comandos de Download (15)
            download: ['download-arquivo', 'download-texto', 'download-json', 'download-csv', 'download-imagem', 'download-pdf', 'download-zip', 'download-doc', 'download-xls', 'download-ppt', 'download-html', 'download-css', 'download-js', 'download-mp3', 'download-mp4'],
            
            // Comandos de Layout (30)
            layout: ['espaco', 'espaco-pequeno', 'espaco-medio', 'espaco-grande', 'espaco-duplo', 'linha-horizontal', 'linha-vertical', 'quebra-linha', 'coluna', 'linha', 'container-flex', 'grid', 'padding', 'margin', 'centralizar', 'alinhar-centro', 'alinhar-direita', 'alinhar-esquerda', 'justificar', 'flex-row', 'flex-column', 'flex-wrap', 'flex-nowrap', 'flex-center', 'flex-between', 'flex-around', 'flex-evenly', 'grid-2', 'grid-3', 'grid-4', 'grid-5', 'grid-6'],
            
            // Comandos de Bibliotecas (25)
            bibliotecas: ['usar-biblioteca', 'importar-css', 'importar-js', 'importar-fonte', 'usar-jquery', 'usar-bootstrap', 'usar-react', 'usar-vue', 'usar-angular', 'usar-tailwind', 'usar-fontawesome', 'usar-chartjs', 'usar-threejs', 'usar-phaser', 'usar-p5js', 'usar-d3', 'usar-moment', 'usar-axios', 'usar-lodash', 'usar-underscore', 'usar-backbone', 'usar-ember', 'usar-svelte', 'usar-nextjs', 'usar-nuxtjs'],
            
            // Comandos de Ações (30)
            acoes: ['onclick', 'ondblclick', 'onchange', 'oninput', 'onsubmit', 'onfocus', 'onblur', 'onkeydown', 'onkeyup', 'onkeypress', 'onmouseenter', 'onmouseleave', 'onmousemove', 'onmousedown', 'onmouseup', 'onwheel', 'onscroll', 'onresize', 'onload', 'onunload', 'onerror', 'onabort', 'oncontextmenu', 'ondrag', 'ondrop', 'onselect', 'oncopy', 'oncut', 'onpaste', 'ontoggle'],
            
            // Comandos de Jogo (30)
            jogo: ['player', 'obstaculo', 'colising', 'inimigo', 'moeda', 'vida', 'pontuacao', 'fase', 'game-over', 'reset-jogo', 'pausar-jogo', 'continuar-jogo', 'salvar-jogo', 'carregar-jogo', 'nivel', 'xp', 'habilidade', 'inventario', 'arma', 'escudo', 'pocao', 'baus', 'portal', 'checkpoint', 'cronometro', 'recorde', 'ranking', 'conquista', 'trofeu', 'medalha'],
            
            // Comandos de Mídia (20)
            midia: ['imagem', 'video', 'audio', 'iframe', 'embed', 'objeto', 'param', 'source', 'track', 'map', 'area', 'canvas', 'svg', 'circle', 'rect', 'path', 'text-svg', 'gif', 'animacao', 'transicao'],
            
            // Comandos de Banco (15)
            banco: ['armazenar', 'recuperar', 'remover-storage', 'limpar-storage', 'salvar-sessao', 'recuperar-sessao', 'remover-sessao', 'criar-cookie', 'ler-cookie', 'remover-cookie', 'indexeddb', 'localdb', 'cache', 'service-worker', 'web-worker'],
            
            // Comandos de Rede (15)
            rede: ['requisicao', 'fetch', 'ajax', 'jsonp', 'websocket', 'sse', 'api', 'rest', 'graphql', 'soap', 'rpc', 'socket', 'mqtt', 'webhook', 'restful'],
            
            // Comandos de Utilidades (25)
            utilidades: ['alert', 'confirm', 'prompt', 'console', 'debug', 'log', 'erro', 'sucesso', 'info', 'aviso', 'math-random', 'math-floor', 'math-ceil', 'math-round', 'math-max', 'math-min', 'math-sqrt', 'math-pow', 'data-hora', 'data-formatada', 'hora-formatada', 'diferenca-data', 'timestamp', 'uuid', 'hash'],
            
            // Comandos de Interface (25)
            interface: ['modal', 'popup', 'tooltip', 'accordion', 'tabs', 'carousel', 'slider', 'dropdown', 'navbar', 'sidebar', 'footer', 'header', 'section', 'article', 'aside', 'nav', 'main', 'details', 'summary', 'progress', 'meter', 'dialog', 'menu', 'menuitem', 'menu-button'],
            
            // Comandos de Animação (20)
            animacao: ['animar', 'transicao', 'fade-in', 'fade-out', 'slide-in', 'slide-out', 'zoom-in', 'zoom-out', 'rotate', 'scale', 'move', 'pulse', 'bounce', 'shake', 'flip', 'glow', 'blur', 'sparkle', 'rainbow', 'gradient-move']
        };

        // ============================================
        // INTERPRETADOR PRINCIPAL
        // ============================================

        function executar() {
            const painel = document.getElementById('painel');
            const codigo = document.getElementById('codigo').value;
            
            if (loopAtivo) clearInterval(loopAtivo);
            timers.forEach(t => clearTimeout(t));
            loops.forEach(l => clearInterval(l));
            timers = [];
            loops = [];
            painel.innerHTML = '';
            elementos = {};
            variaveis = {};
            colisoes = {};
            animacoes = [];

            const linhas = codigo.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            linhas.forEach(linha => {
                const comandos = linha.split(';').map(c => c.trim());
                comandos.forEach(cmd => {
                    if (!cmd) return;
                    let comando = cmd;
                    if (cmd.startsWith('administract>c>')) {
                        comando = cmd.replace('administract>c>', '').trim();
                    }
                    interpretar8(comando, painel);
                });
            });
        }

        function interpretar8(comando, painel) {
            // ==========================================
            // COMANDOS DE TEXTO (30)
            // ==========================================
            if (comando.startsWith('titulo ')) {
                const match = comando.match(/titulo\s+"([^"]+)"(?:\s+tamanho=(\d+))?/);
                if (match) {
                    const el = document.createElement(`h${match[2] || '2'}`);
                    el.textContent = match[1];
                    el.style.cssText = 'color:#00ffcc;margin:15px 0;text-shadow:0 0 20px #00ffcc33;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('subtitulo ')) {
                const match = comando.match(/subtitulo\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('h3');
                    el.textContent = match[1];
                    el.style.cssText = 'color:#ffd700;margin:10px 0;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('paragrafo ')) {
                const match = comando.match(/paragrafo\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('p');
                    el.textContent = match[1];
                    el.style.cssText = 'color:#aaa;margin:8px 0;line-height:1.8;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-central ')) {
                const match = comando.match(/texto-central\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('div');
                    el.textContent = match[1];
                    el.style.cssText = 'text-align:center;color:#fff;padding:10px;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-direita ')) {
                const match = comando.match(/texto-direita\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('div');
                    el.textContent = match[1];
                    el.style.cssText = 'text-align:right;color:#fff;padding:10px;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-esquerda ')) {
                const match = comando.match(/texto-esquerda\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('div');
                    el.textContent = match[1];
                    el.style.cssText = 'text-align:left;color:#fff;padding:10px;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-grande ')) {
                const match = comando.match(/texto-grande\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('div');
                    el.textContent = match[1];
                    el.style.cssText = 'font-size:2em;color:#fff;margin:10px 0;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-pequeno ')) {
                const match = comando.match(/texto-pequeno\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('small');
                    el.textContent = match[1];
                    el.style.cssText = 'font-size:0.8em;color:#888;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-colorido ')) {
                const match = comando.match(/texto-colorido\s+"([^"]+)"\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('span');
                    el.textContent = match[1];
                    el.style.cssText = `color:${match[2]};font-size:18px;margin:5px;display:inline-block;`;
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-fundo ')) {
                const match = comando.match(/texto-fundo\s+"([^"]+)"\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('span');
                    el.textContent = match[1];
                    el.style.cssText = `background:${match[2]};color:#fff;padding:8px 15px;border-radius:8px;margin:5px;display:inline-block;`;
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-gradiente ')) {
                const match = comando.match(/texto-gradiente\s+"([^"]+)"\s+"([^"]+)"\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('span');
                    el.textContent = match[1];
                    el.style.cssText = `background:linear-gradient(to right, ${match[2]}, ${match[3]});-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:28px;font-weight:bold;display:inline-block;margin:5px;`;
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-destaque ')) {
                const match = comando.match(/texto-destaque\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('span');
                    el.textContent = match[1];
                    el.style.cssText = 'background:#ffd700;color:#000;padding:8px 20px;border-radius:8px;font-weight:bold;display:inline-block;margin:5px;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-piscante ')) {
                const match = comando.match(/texto-piscante\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('span');
                    el.textContent = match[1];
                    el.style.cssText = 'animation:piscar 0.8s infinite;color:#ff6b6b;font-weight:bold;display:inline-block;margin:5px;';
                    if (!document.querySelector('style[data-piscar]')) {
                        const style = document.createElement('style');
                        style.dataset.piscar = 'true';
                        style.textContent = '@keyframes piscar{0%,100%{opacity:1}50%{opacity:0}}';
                        document.head.appendChild(style);
                    }
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-negrito ')) {
                const match = comando.match(/texto-negrito\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('strong');
                    el.textContent = match[1];
                    el.style.cssText = 'font-weight:bold;color:#fff;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-italico ')) {
                const match = comando.match(/texto-italico\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('em');
                    el.textContent = match[1];
                    el.style.cssText = 'font-style:italic;color:#fff;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-sublinhado ')) {
                const match = comando.match(/texto-sublinhado\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('u');
                    el.textContent = match[1];
                    el.style.cssText = 'text-decoration:underline;color:#fff;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-riscado ')) {
                const match = comando.match(/texto-riscado\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('del');
                    el.textContent = match[1];
                    el.style.cssText = 'text-decoration:line-through;color:#888;';
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-neon ')) {
                const match = comando.match(/texto-neon\s+"([^"]+)"\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('span');
                    el.textContent = match[1];
                    el.style.cssText = `color:${match[2]};text-shadow:0 0 10px ${match[2]},0 0 20px ${match[2]},0 0 40px ${match[2]};font-size:24px;font-weight:bold;display:inline-block;margin:5px;`;
                    painel.appendChild(el);
                }
            }
            else if (comando.startsWith('texto-metalico ')) {
                const match = comando.match(/texto-metalico\s+"([^"]+)"/);
                if (match) {
                    const el = document.createElement('span');
                    el.textContent = match[1];
                    el.style.cssText = 'background:linear-gradient(45deg,#ffd700,#ffaa00,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:24px;font-weight:bold;display:inline-block;margin:5px;';
                    painel.appendChild(el);
                }
            }

            // ==========================================
            // CORES E FUNDOS (30 novos)
            // ==========================================
            else if (comando.startsWith('cor-fundo ')) {
                const match = comando.match(/cor-fundo\s+"([^"]+)"/);
                if (match) painel.style.backgroundColor = match[1];
            }
            else if (comando.startsWith('gradiente ')) {
                const match = comando.match(/gradiente\s+"([^"]+)"\s+"([^"]+)"/);
                if (match) painel.style.background = `linear-gradient(135deg, ${match[1]}, ${match[2]})`;
            }
            else if (comando.startsWith('gradiente-radial ')) {
                const match = comando.match(/gradiente-radial\s+"([^"]+)"\s+"([^"]+)"/);
                if (match) painel.style.background = `radial-gradient(circle, ${match[1]}, ${match[2]})`;
            }
            else if (comando.startsWith('gradiente-conico ')) {
                const match = comando.match(/gradiente-conico\s+"([^"]+)"\s+"([^"]+)"/);
                if (match) painel.style.background = `conic-gradient(from 0deg, ${match[1]}, ${match[2]})`;
            }
            else if (comando.startsWith('fundo-imagem ')) {
                const match = comando.match(/fundo-imagem\s+"([^"]+)"/);
                if (match) painel.style.backgroundImage = `url(${match[1]})`;
            }
            else if (comando.startsWith('fundo-escuro')) {
                painel.style.backgroundColor = '#1a1a1a';
                painel.style.color = '#fff';
            }
            else if (comando.startsWith('fundo-claro')) {
                painel.style.backgroundColor = '#f5f5f5';
                painel.style.color = '#000';
            }
            else if (comando.startsWith('fundo-azul')) painel.style.backgroundColor = '#1a237e';
            else if (comando.startsWith('fundo-verde')) painel.style.backgroundColor = '#1b5e20';
            else if (comando.startsWith('fundo-vermelho')) painel.style.backgroundColor = '#b71c1c';

        function criarInput(id, type, placeholder, painel) {
            const input = document.createElement('input');
            input.id = id;
            input.type = type;
            input.placeholder = placeholder || '';
            input.style.cssText = 'width:100%;padding:12px;margin:8px 0;border-radius:8px;border:2px solid #333;background:#1a1a1a;color:#fff;font-size:16px;transition:border-color 0.3s;';
            input.onfocus = () => input.style.borderColor = '#00ffcc';
            input.onblur = () => input.style.borderColor = '#333';
            painel.appendChild(input);
            elementos[id] = input;
            return input;
        }

        function criarLink(url, texto, target, cor, painel) {
            const a = document.createElement('a');
            a.href = url;
            a.textContent = texto;
            a.target = target;
            a.style.cssText = `color:${cor};text-decoration:none;display:inline-block;margin:5px;padding:5px 15px;border:2px solid ${cor};border-radius:8px;transition:all 0.3s;`;
            a.onmouseover = () => { a.style.background = cor + '22'; a.style.transform = 'scale(1.05)'; };
            a.onmouseout = () => { a.style.background = 'transparent'; a.style.transform = 'scale(1)'; };
            painel.appendChild(a);
            return a;
        }

        function criarUpload(id, accept, painel) {
            const input = document.createElement('input');
            input.id = id;
            input.type = 'file';
            input.accept = accept;
            input.style.cssText = 'width:100%;padding:12px;margin:8px 0;border:2px dashed #333;border-radius:8px;background:#1a1a1a;color:#fff;cursor:pointer;';
            input.onchange = (e) => {
                const files = e.target.files;
                if (files.length > 0) {
                    const msg = `📁 ${files.length} arquivo(s) selecionado(s)`;
                    alert(msg);
                    criarMensagem(msg, '#00ffcc', painel);
                }
            };
            painel.appendChild(input);
            elementos[id] = input;
            return input;
        }

        function criarDownload(conteudo, nome, tipo, painel) {
            const btn = document.createElement('button');
            btn.textContent = `📥 Baixar ${nome}`;
            btn.style.cssText = 'background:#3498db;color:#fff;padding:12px 25px;border:none;border-radius:8px;cursor:pointer;margin:5px;font-weight:bold;transition:all 0.3s;';
            btn.onmouseover = () => btn.style.transform = 'scale(1.05)';
            btn.onmouseout = () => btn.style.transform = 'scale(1)';
            btn.onclick = () => {
                const blob = new Blob([conteudo], { type: tipo });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = nome;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                criarMensagem(`✅ Download de ${nome} iniciado!`, '#2ecc71', painel);
            };
            painel.appendChild(btn);
            return btn;
        }

        function criarMensagem(texto, cor, painel) {
            const div = document.createElement('div');
            div.textContent = texto;
            div.style.cssText = `background:${cor}22;color:${cor};padding:12px 20px;border:2px solid ${cor};border-radius:8px;margin:8px 0;font-weight:bold;`;
            painel.appendChild(div);
            return div;
        }

        function executarAcao(acao, painel) {
            if (acao.startsWith('alert:')) alert(acao.replace('alert:', ''));
            else if (acao.startsWith('console:')) console.log(acao.replace('console:', ''));
            else if (acao.startsWith('sucesso:')) criarMensagem(acao.replace('sucesso:', ''), '#2ecc71', painel);
            else if (acao.startsWith('erro:')) criarMensagem(acao.replace('erro:', ''), '#e74c3c', painel);
            else if (acao.startsWith('info:')) criarMensagem(acao.replace('info:', ''), '#3498db', painel);
            else if (acao.startsWith('aviso:')) criarMensagem(acao.replace('aviso:', ''), '#f39c12', painel);
            else if (acao.startsWith('cor-fundo:')) {
                painel.style.backgroundColor = acao.replace('cor-fundo:', '');
            }
            else if (acao.startsWith('variavel:')) {
                const parts = acao.replace('variavel:', '').split('=');
                if (parts.length === 2) {
                    variaveis[parts[0]] = parseInt(parts[1]) || 0;
                    console.log(`📊 ${parts[0]} = ${variaveis[parts[0]]}`);
                }
            }
            else {
                alert(`🎯 Ação executada: ${acao}`);
            }
        }

        function carregarBiblioteca(nome) {
            const bibliotecas = {
                'bootstrap': { css: 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css', js: 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js' },
                'jquery': { js: 'https://code.jquery.com/jquery-3.7.0.min.js' },
                'fontawesome': { css: 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' },
                'react': { js: 'https://unpkg.com/react@18/umd/react.production.min.js', js2: 'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js' },
                'vue': { js: 'https://unpkg.com/vue@3/dist/vue.global.js' },
                'tailwind': { css: 'https://cdn.tailwindcss.com' },
                'chartjs': { js: 'https://cdn.jsdelivr.net/npm/chart.js' },
                'threejs': { js: 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js' }
            };

            const lib = bibliotecas[nome];
            if (!lib) return;

            if (lib.css) {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = lib.css;
                document.head.appendChild(link);
            }
            if (lib.js) {
                const script = document.createElement('script');
                script.src = lib.js;
                document.head.appendChild(script);
            }
            if (lib.js2) {
                const script = document.createElement('script');
                script.src = lib.js2;
                document.head.appendChild(script);
            }
        }

        function iniciarPlayer8(id, painel) {
            const el = elementos[id];
            if (!el) return;
            
            painel.style.position = 'relative';
            el.style.position = 'absolute';
            el.style.zIndex = '100';
            let x = parseInt(el.style.left) || 20;
            let y = parseInt(el.style.top) || 60;
            const teclas = { w: false, a: false, s: false, d: false };
            
            document.addEventListener('keydown', (e) => {
                const t = e.key.toLowerCase();
                if (t in teclas) { teclas[t] = true; e.preventDefault(); }
            });
            document.addEventListener('keyup', (e) => {
                const t = e.key.toLowerCase();
                if (t in teclas) teclas[t] = false;
            });
            
            function checarColisao8(nx, ny) {
                const r1 = { left: nx, top: ny, right: nx + 50, bottom: ny + 50 };
                let colidiu = false;
                Object.keys(elementos).forEach(id2 => {
                    const obj = elementos[id2];
                    if (obj === el || !obj.dataset) return;
                    if (obj.dataset.gameType !== 'obstaculo') return;
                    const r2 = { left: obj.offsetLeft, top: obj.offsetTop, right: obj.offsetLeft + 40, bottom: obj.offsetTop + 40 };
                    if (r1.left < r2.right && r1.right > r2.left && r1.top < r2.bottom && r1.bottom > r2.top) {
                        colidiu = true;
                        if (colisoes[id2] && colisoes[id2].player === id) {
                            const cfg = colisoes[id2];
                            if (cfg.acao === 'alert') alert(cfg.valor || 'Colisão!');
                        }
                    }
                    // Verificar moedas
                    if (obj.textContent === '⭐' || obj.textContent === '💎' || obj.textContent === '🎯') {
                        const r2 = { left: obj.offsetLeft, top: obj.offsetTop, right: obj.offsetLeft + 40, bottom: obj.offsetTop + 40 };
                        if (r1.left < r2.right && r1.right > r2.left && r1.top < r2.bottom && r1.bottom > r2.top) {
                            const valor = parseInt(obj.dataset.valor) || 10;
                            alert(`💰 +${valor} pontos!`);
                            obj.style.display = 'none';
                            setTimeout(() => {
                                obj.style.display = 'block';
                                obj.style.left = Math.random() * 400 + 50 + 'px';
                                obj.style.top = Math.random() * 300 + 50 + 'px';
                            }, 2000);
                        }
                    }
                });
                return colidiu;
            }
            
            if (loopAtivo) clearInterval(loopAtivo);
            loopAtivo = setInterval(() => {
                let vel = 5, nx = x, ny = y;
                if (teclas.w) ny -= vel;
                if (teclas.s) ny += vel;
                if (teclas.a) nx -= vel;
                if (teclas.d) nx += vel;
                
                if (!checarColisao8(nx, y)) x = nx;
                if (!checarColisao8(x, ny)) y = ny;
                
                el.style.left = x + 'px';
                el.style.top = y + 'px';
            }, 1000/60);
        }
